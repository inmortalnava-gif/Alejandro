<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Novia 🌌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #ffffff;
        }

        /* Fondo de Estrellas */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Tarjeta Galáctica */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .planet {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(168, 192, 255, 0.5);
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e5e7eb;
            margin-bottom: 25px;
        }

        /* Botón Interactivo */
        .btn {
            background: #8b5cf6;
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            outline: none;
        }

        .btn:hover {
            background: #7c3aed;
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
        }

        /* Mensaje Oculto */
        .hidden-message {
            margin-top: 0;
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffd700;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out, opacity 0.5s ease-out, margin-top 0.5s ease-out;
            opacity: 0;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        }

        .hidden-message.show {
            max-height: 100px;
            opacity: 1;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <div class="card">
        <div class="planet">🪐</div>
        <h1>¡Feliz Día de la Novia!</h1>
        <p>
            Entre más de 100 mil millones de galaxias en el universo observable... tu luz sigue siendo mi lugar favorito en el cosmos. ✨
        </p>
        
        <button class="btn" id="miBoton">Descubrir un secreto 🚀</button>
        
        <div class="hidden-message" id="secret">
            ¡Te amo de aquí a la última estrella del universo! ❤️💫
        </div>
    </div>

    <!-- Elemento de Audio NATIVO e INVISIBLE -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/GoldenHour_201901/GoldenHour.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Generador de estrellas de fondo
        const starsContainer = document.getElementById('stars');
        const count = 80;

        for (let i = 0; i < count; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            
            starsContainer.appendChild(star);
        }

        // Elemento de audio
        const audio = document.getElementById('bgMusic');

        // Control del botón: revela el secreto Y reproduce la música sin fallos
        document.getElementById('miBoton').addEventListener('click', function() {
            const secret = document.getElementById('secret');
            secret.classList.toggle('show');
            
            if (secret.classList.contains('show')) {
                this.textContent = "Ocultar secreto 🌌";
                audio.play().catch(err => console.log("Error al reproducir audio:", err));
            } else {
                this.textContent = "Descubrir un secreto 🚀";
                audio.pause();
            }
        });
    </script>
</body>
</html>
